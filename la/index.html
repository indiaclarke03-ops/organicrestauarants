*{box-sizing:border-box}

a{color:inherit}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.brand{font-family:var(--display);font-weight:700;font-size:20px;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.brand .beta{font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--chip);color:var(--muted);padding:5px 7px;border-radius:999px;margin-left:4px}
.top nav{display:flex;gap:2px;flex-wrap:wrap}

.top nav a.active,.top nav a:hover{background:var(--accent-soft);color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding-block:22px 40px;padding-inline:20px}
.foot{max-width:1180px;margin:0 auto;padding:22px 20px 44px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:8px}

.search{display:flex;gap:8px;max-width:560px}

.search input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 16px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

.mapwrap{position:sticky;top:70px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.chipbtn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink-2);padding:6px 11px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chipbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-size:13px;color:var(--muted);margin:4px 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.list{display:grid;gap:8px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;transition:border-color .15s,transform .15s}

.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .grow{flex:1 1 auto;min-width:0}
.name{font-weight:600;font-size:15.5px}
.sub{font-size:12.5px;color:var(--muted)}

.grade.A{background:var(--gA)}.grade.B{background:var(--gB)}.grade.C{background:var(--gC)}.grade.D{background:var(--gD)}.grade.E{background:var(--gE)}

.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--chip);font-size:12px;white-space:nowrap;line-height:1.5}
.chip.tier{color:#fff;font-weight:700;font-family:var(--mono);font-size:11.5px}
.chip.P1{background:var(--p1)}.chip.P2{background:var(--p2)}.chip.P3{background:var(--p3)}.chip.P4{background:var(--p4)}.chip.P5{background:var(--p5)}.chip.P6{background:var(--gE)}
.chip.mode{border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.chip.mode.published{border-color:var(--gA);color:var(--gA);font-weight:600}
.chip.mode.on_request{border-color:var(--gC);color:var(--gC);font-weight:600}
.chip.mode.refused{border-color:var(--gE);color:var(--gE);border-style:dashed}
.chip.badge{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.sample{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--und);margin:6px 0;min-width:120px}

.bar i.P1{background:var(--p1)}.bar i.P2{background:var(--p2)}.bar i.P3{background:var(--p3)}.bar i.P4{background:var(--p4)}.bar i.P5{background:var(--p5)}

.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0}
.panel.lift{box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.kv{display:grid;grid-template-columns:max-content 1fr;gap:5px 16px;font-size:14px;margin:10px 0 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}

.note{font-size:13px;color:var(--muted);background:var(--panel-2);border-radius:12px;padding:10px 13px;margin:10px 0 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.three div{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;text-align:center;color:var(--muted)}
.three div.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);font-weight:600}
.back{font-size:13.5px;text-decoration:none;color:var(--muted)}
.supcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}

.cta{background:linear-gradient(135deg,var(--accent-soft),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:22px 0}

.checks{display:grid;gap:6px;margin:10px 0 4px}

body{padding:0 16px}
main,.foot,.top .in{padding-left:0;padding-right:0}

/* ---------- map (Leaflet when available, SVG schematic otherwise) ---------- */
let map, markers;

/* Vector basemap (OpenStreetMap data via Overpass, see pipeline/s09_basemap.py). Used when tiles cannot load. */
const BM = window.PROVENANCE_BASEMAP;
const merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
let vm = null;
function vectorMap(el, rs){
  const b = BM ? BM.bbox : [40.69, -74.02, 40.76, -73.93];
  const X = lng => (lng - b[1]) * 10000, Y = lat => (merc(b[2]) - merc(lat)) * 10000 * (180 / Math.PI);
  const W = X(b[3]), H = Y(b[0]);
  if (!vm || vm.el !== el) {
    const poly = (arr, cls) => arr.map(p => `<polygon class="${cls}" points="${p.map(([la, ln]) => X(ln).toFixed(1) + ',' + Y(la).toFixed(1)).join(' ')}"/>`).join('');
    const roads = BM ? BM.roads.map(r => `<polyline class="rd ${r.c}" points="${r.p.map(([la, ln]) => X(ln).toFixed(1) + ',' + Y(la).toFixed(1)).join(' ')}"/>`).join('') : '';
    const seen = new Set(), labels = [];
    if (BM) for (const r of BM.roads) { if (r.c === 'major' && r.n && !seen.has(r.n) && r.p.length > 3) { seen.add(r.n); const m = r.p[Math.floor(r.p.length / 2)], n = r.p[Math.floor(r.p.length / 2) + 1]; const ang = Math.atan2(Y(n[0]) - Y(m[0]), X(n[1]) - X(m[1])) * 180 / Math.PI; labels.push(`<text class="lbl" transform="translate(${X(m[1]).toFixed(1)},${Y(m[0]).toFixed(1)}) rotate(${(ang > 90 || ang < -90 ? ang + 180 : ang).toFixed(0)})" text-anchor="middle" dy="-3">${esc(r.n)}</text>`); } }
    el.innerHTML = `<svg class="vmap" viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" preserveAspectRatio="xMidYMid slice"><g class="base">${BM ? poly(BM.water, 'water') + poly(BM.parks, 'park') + roads : ''}<g class="labels">${labels.join('')}</g></g><g class="marks"></g></svg><div class="zoomctl"><button type="button" aria-label="Zoom in" data-z="in">+</button><button type="button" aria-label="Zoom out" data-z="out">−</button></div><div class="mappop" hidden></div>`;
    const svg = el.querySelector('svg'), pop = el.querySelector('.mappop');
    vm = {el, svg, pop, W, H, X, Y, vb: null};
    const fit = (pts) => { if (!pts.length) { vm.vb = [0, 0, W, H]; } else { const xs = pts.map(p => X(p[1])), ys = pts.map(p => Y(p[0])); let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = Math.max(60, (x1 - x0) * 0.12, (y1 - y0) * 0.12); vm.vb = [x0 - pad, y0 - pad, Math.max(200, x1 - x0 + 2 * pad), Math.max(200, y1 - y0 + 2 * pad)]; } apply(); };
    const apply = () => { const [x, y, w, h] = vm.vb, ar = el.clientWidth / Math.max(1, el.clientHeight); let ww = w, hh = h; if (ww / hh < ar) ww = hh * ar; else hh = ww / ar; svg.setAttribute('viewBox', `${x - (ww - w) / 2} ${y - (hh - h) / 2} ${ww} ${hh}`); const sc = Math.max(0.35, Math.min(2.2, 900 / ww)); svg.querySelectorAll('.mk').forEach(g => g.setAttribute('transform', `${g.dataset.t} scale(${(1 / sc).toFixed(3)})`)); svg.querySelectorAll('.lbl').forEach(t => t.style.fontSize = `${(10 / sc).toFixed(1)}px`); };
    vm.fit = fit; vm.apply = apply;
    const zoom = (f, cx, cy) => { const [x, y, w, h] = vm.vb; const px = cx == null ? x + w / 2 : cx, py = cy == null ? y + h / 2 : cy; vm.vb = [px - (px - x) * f, py - (py - y) * f, w * f, h * f]; apply(); };
    const toSvg = (ev) => { const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return [vb.x + (ev.clientX - r.left) / r.width * vb.width, vb.y + (ev.clientY - r.top) / r.height * vb.height]; };
    el.querySelector('.zoomctl').addEventListener('click', e => { const z = e.target.dataset.z; if (z) zoom(z === 'in' ? 0.7 : 1.4); });
    svg.addEventListener('wheel', e => { e.preventDefault(); const [cx, cy] = toSvg(e); zoom(e.deltaY > 0 ? 1.15 : 0.87, cx, cy); }, {passive: false});
    let drag = null;
    svg.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, vb: [...vm.vb]}; svg.setPointerCapture(e.pointerId); pop.hidden = true; });
    svg.addEventListener('pointermove', e => { if (!drag) return; const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; vm.vb = [drag.vb[0] - (e.clientX - drag.x) / r.width * vb.width, drag.vb[1] - (e.clientY - drag.y) / r.height * vb.height, drag.vb[2], drag.vb[3]]; apply(); });
    svg.addEventListener('pointerup', () => drag = null); svg.addEventListener('pointercancel', () => drag = null);
    svg.addEventListener('click', e => { const g = e.target.closest('.mk'); if (!g) return; const r = byCamis[g.dataset.c]; const rect = el.getBoundingClientRect(); pop.innerHTML = `<b>${esc(dname(r))}</b><br><span class="sub">${esc(r.neighborhood)} · Grade ${r.grade} · ${r.named_any || 0} producer(s) named</span><br><a href="#/r/${r.camis}">Open</a>`; pop.hidden = false; pop.style.left = Math.min(rect.width - 250, Math.max(8, e.clientX - rect.left + 10)) + 'px'; pop.style.top = Math.max(8, e.clientY - rect.top - 10) + 'px'; });
    window.addEventListener('resize', () => vm && vm.el.isConnected && apply());
  }
  const marks = vm.svg.querySelector('.marks');
  marks.innerHTML = rs.filter(r => r.lat && r.lng).map(r => `<g class="mk ${r.grade}" data-c="${r.camis}" data-t="translate(${X(r.lng).toFixed(1)},${Y(r.lat).toFixed(1)})" tabindex="0"><title>${esc(dname(r))} — grade ${r.grade}</title><rect x="-9" y="-9" width="18" height="18" rx="5"/><text y="3.5" text-anchor="middle">${r.grade}</text></g>`).join('');
  vm.fit(rs.filter(r => r.lat && r.lng).map(r => [r.lat, r.lng]));
}
function drawMap(rs){
  const el = document.getElementById('map'); if (!el) return;
  if (!window.L) { vectorMap(el, rs); return; }
  if (!map) {
    map = L.map('map', {scrollWheelZoom: true, zoomControl: false}).setView([34.07, -118.395], 14); L.control.zoom({position: 'topright'}).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
    markers = L.layerGroup().addTo(map);
  }
  markers.clearLayers();
  rs.forEach(r => {
    if (!r.lat || !r.lng) return;
    const icon = L.divIcon({className: '', html: `<div class="marker ${r.grade}">${r.grade}</div>`, iconSize: [26, 26], iconAnchor: [13, 13]});
    L.marker([r.lat, r.lng], {icon}).addTo(markers).bindPopup(`<b>${esc(dname(r))}</b><br>${esc(r.neighborhood)} · Grade ${r.grade}<br>${r.named_any || 0} producer(s) named<br><a href="#/r/${r.camis}">Open</a>`);
  });
  if (rs.length && rs.length < D.restaurants.length) { const b = L.latLngBounds(rs.filter(r => r.lat).map(r => [r.lat, r.lng])); if (b.isValid()) map.fitBounds(b.pad(0.2), {maxZoom: 15}); }
}

function gradeChecks(r){
  const d = r.grade_detail || {}; if (!d.disclosure) return '';
  const disc = {most: ['ok', 'Producers named for most of the menu'], some: ['part', 'Some producers named'], claims: ['no', 'Sourcing claims, no producer named'], none: ['no', 'No sourcing disclosed']}[d.disclosure];
  const ver = d.produce_named ? [d.verified_share >= 0.5 ? 'ok' : d.verified ? 'part' : 'no', `${d.verified} of ${d.produce_named} named produce supplier${d.produce_named > 1 ? 's' : ''} verified organic or peer-certified (${Math.round(d.verified_share * 100)}%)${d.verified_names?.length ? ': ' + esc(d.verified_names.join(', ')) : ''}`] : ['no', 'No produce supplier named'];
  const flags = [];
  if (d.lapsed?.length) flags.push(['warn', `Lapsed certification named as a current supplier: ${esc(d.lapsed.join(', '))}. Caps the grade at B.`]);
  if (d.ambiguous?.length) flags.push(['part', `Registry record ambiguous for ${esc(d.ambiguous.join(', '))}; not counted as verified`]);
  if (d.unconfirmed_alias?.length) flags.push(['part', `Name match not yet confirmed for ${esc(d.unconfirmed_alias.join(', '))}; not counted as verified`]);
  if (d.opaque_distributors?.length) flags.push(['part', `Distributor named instead of grower: ${esc(d.opaque_distributors.join(', '))} (chain stops there)`]);
  if (!flags.length) flags.push(['ok', 'No lapsed certifications or registry conflicts among named suppliers']);
  return `<div class="checks">${[disc, ver, ...flags].map(([c, t]) => `<div class="check"><i class="${c}">${{ok: '✓', part: '~', no: '–', warn: '!'}[c]}</i><span>${t}</span></div>`).join('')}</div>`;
}

  </div>

function producer(pid){

  const t = tierBase(p.tier);
  const ev = p.nop_op_id ? `<dl class="kv"><dt>NOP Operation ID</dt><dd><span class="mono">${esc(p.nop_op_id)}</span> — search it in the <a href="https://organic.ams.usda.gov/integrity/" target="_blank" rel="noopener">USDA Organic INTEGRITY Database</a></dd>
     <dt>Certifier</dt><dd>${esc(p.certifier)}</dd><dt>Operation status</dt><dd>${esc(p.op_status)} (effective ${esc(p.status_effective)})</dd><dt>Anniversary date</dt><dd>${esc(p.anniversary || '—')}</dd>
     <dt>Scopes</dt><dd>${esc((p.scopes_certified || '').replace(/;/g, ' · '))}</dd><dt>Certified products (Crops)</dt><dd>${esc(p.crops_products || '—')}</dd><dt>Checked against snapshot</dt><dd>${esc(p.integrity_checked)}</dd></dl>` : '';

     <p class="sub">Certified Naturally Grown uses peer inspection by other local farmers plus random pesticide-residue testing, on standards modelled on the National Organic Program. A different verification model from USDA accreditation, not a lesser one.</p>` : '';
  app.innerHTML = `<a class="back" href="#/producers">← All producers</a>
  <div class="row" style="margin-top:12px;align-items:flex-start"><span class="chip tier ${t}" style="font-size:15px;padding:8px 13px;margin-top:6px">${esc(p.tier)}</span><div class="grow"><div class="eyebrow">${esc([p.city, p.state].filter(Boolean).join(', ') || 'Location not yet confirmed')}${p.category ? ' · ' + CAT_LABEL[p.category] : ''}${p.type ? ' · ' + esc(p.type) : ''}</div><h1>${esc(p.canonical_name)}</h1>${p.website ? `<div class="sub"><a href="${esc(p.website)}" target="_blank" rel="noopener">website</a></div>` : ''}</div></div>

    ${p.flags.length ? `<p>Flags: ${p.flags.map(f => `<span class="chip">${esc({'greenmarket-producer':'Sells at GrowNYC Greenmarkets','hydroponic':'Hydroponic (flagged, not ranked)','coop':'Co-operative (the co-op is the node)','registry-ambiguous':'Common name; not matched on name alone','sm-market-organic':'Santa Monica Farmers Market lists as ORGANIC (lead)','sm-market-vendor':'Sells at Santa Monica Farmers Market','bh-market-vendor':'Sells at Beverly Hills Farmers Market','self-declared-organic':'Farm site says certified organic (lead)','certified-humane':'Certified Humane (welfare, not organic)'}[f] || f)}</span>`).join(' ')}</p>` : ''}
    ${p.notes ? `<p class="sub">Note: ${esc(p.notes)}</p>` : ''}
    ${t === 'P4' ? `<p class="note">Named, not yet verified: we know who this producer is and nothing beyond that is established. It is not a demerit; it is the outreach queue. A farm can move to P3 with a signed practices questionnaire, or to P1/P2 by pointing us to a registry record. Farmers: <a href="${mail(`Producer record: ${p.canonical_name}`, 'I represent this farm. Here is how to verify our practices:\n')}">get in touch</a>.</p>` : ''}
    ${t === 'P5' ? '<p class="note">A distributor is a node, not a leaf. The restaurant has disclosed its buying channel, not the grower. A brand program or specialty distributor can carry good product; this tier is not a quality signal on its own.</p>' : ''}
  </div>
  <h2>Named by ${p.n_restaurants} restaurant${p.n_restaurants === 1 ? '' : 's'}</h2>
  <div class="list">${p.restaurants.map(c => byCamis[c]).filter(Boolean).map(card).join('')}</div>`;
}

function producers(){
  let tier = '', q = '';
  const render = () => {
    const rows = D.producers.filter(p => (!tier || tierBase(p.tier) === tier) && (!q || (p.canonical_name + ' ' + p.city + ' ' + p.state + ' ' + (p.certifier || '')).toLowerCase().includes(q)));
    document.getElementById('ptable').innerHTML = rows.map(p => `<tr><td><a href="#/p/${p.producer_id}">${esc(p.canonical_name)}</a><div class="sub">${esc([p.city, p.state].filter(Boolean).join(', '))}${p.category && p.category !== 'produce' ? ' · ' + CAT_LABEL[p.category] : ''}</div></td><td><span class="chip tier ${tierBase(p.tier)}">${esc(p.tier)}</span><div class="sub">${TIER_SHORT[tierBase(p.tier)]}</div></td><td>${esc(p.certifier || p.alt_cert || '—')}${p.op_status && p.op_status !== 'Certified' ? ` <span class="chip">${esc(p.op_status)}</span>` : ''}</td><td style="font-variant-numeric:tabular-nums">${p.n_restaurants}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">No producers match.</td></tr>';
    document.getElementById('pcount').textContent = `${rows.length} producers`;
  };
  const tiers = D.aggregate.producer_tiers || {};
  app.innerHTML = `<div class="eyebrow">Producer graph</div><h1>Producers named by Beverly Hills-area restaurants</h1><p class="lede" style="max-width:70ch;color:var(--ink-2)">Ranked by how many restaurants name them. Many restaurants share the same growers, so verifying one producer improves every restaurant page that names it.</p>
  <div class="stats">${['P1','P2','P3','P5','P4'].filter(t => tiers[t]).map(t => `<div class="stat"><b>${tiers[t]}</b><span><span class="chip tier ${t}">${t}</span> ${TIER_LABEL[t]}</span></div>`).join('')}<div class="stat"><b>${Math.round((D.aggregate.top20_share || 0)*100)}%</b><span>of restaurant→producer links covered by the top 20 producers</span></div></div>
  <div class="filters"><input id="pq" type="search" placeholder="Filter producers" aria-label="Filter producers"><span class="sub" id="pcount"></span></div>
  <div class="chips" id="tchips">${['','P1','P2','P3','P5','P4'].map(t => `<button class="chipbtn ${t===''?'on':''}" data-t="${t}">${t ? `${t} · ${TIER_SHORT[t]}` : 'All tiers'}</button>`).join('')}</div>
  <div class="panel tablewrap"><table><tr><th>Producer</th><th>Tier</th><th>Certifier / program</th><th>Restaurants</th></tr><tbody id="ptable"></tbody></table></div>`;
  document.getElementById('pq').addEventListener('input', e => { q = e.target.value.toLowerCase(); render(); });
  document.getElementById('tchips').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tier = b.dataset.t; document.querySelectorAll('#tchips .chipbtn').forEach(x => x.classList.toggle('on', x.dataset.t === tier)); render(); });
  render();
}

function barChart(items, colors){
  const max = Math.max(1, ...items.map(i => i[1])), W = 560, L = 230, rowH = 30, H = items.length * rowH + 8;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${items.map(([label, v, cls], i) => { const y = i * rowH + 4, w = Math.max(2, (v / max) * (W - L - 40)); return `<text x="${L - 10}" y="${y + 19}" text-anchor="end">${esc(label)}</text><rect class="bg" x="${L}" y="${y + 6}" width="${W - L - 40}" height="16" rx="4"/><rect x="${L}" y="${y + 6}" width="${w}" height="16" rx="4" fill="${colors[cls] || 'var(--accent)'}"/><text class="v" x="${L + w + 6}" y="${y + 19}">${v}</text>`; }).join('')}</svg>`;
}
function findings(){
  const a = D.aggregate, g = a.grades || {}, t = a.producer_tiers || {};
  const gradeColors = {A:'var(--gA)', B:'var(--gB)', C:'var(--gC)', D:'var(--gD)', E:'var(--gE)'}, tierColors = {P1:'var(--p1)', P2:'var(--p2)', P3:'var(--p3)', P4:'var(--p4)', P5:'var(--p5)'};
  const byHood = {}; D.restaurants.forEach(r => { const h = byHood[r.neighborhood] = byHood[r.neighborhood] || {n:0, d:0}; h.n++; if (r.named_any) h.d++; });
  const hoodRows = Object.entries(byHood).sort((x, y) => y[1].n - x[1].n).map(([h, v]) => [h, v.d, 'x', v.n]);
  const top = D.producers.slice(0, 10);

  <p class="lede" style="color:var(--ink-2)">Seed run, ${esc((D.generated_at || '').slice(0,10))}. ${a.crawled} restaurant websites read across ${Object.keys(D.slices || {}).length} contiguous areas: Beverly Hills, Beverly Grove and western West Hollywood, Century City and Pico-Robertson. <strong>${a.disclosing}</strong> name at least one food producer (${Math.round((a.disclosure_rate || 0)*100)}%). <strong>${a.produce_disclosing}</strong> name a produce supplier. <strong>${a.claims_only}</strong> make “local”, “organic” or “farm” claims without naming anyone. Of the ${a.random_sample?.n || 0} restaurants drawn from the OpenStreetMap census rather than picked for their reputation, <strong>${a.random_sample?.disclosing || 0}</strong> named a producer, and both of those name beef brands.</p>
  <h2>Transparency grades</h2>${barChart(['A','B','C','D','E'].map(k => [`${k} · ${GRADE_SHORT[k]}`, g[k] || 0, k]), gradeColors)}
  <p class="sub">No restaurant earns an A or B yet. A B needs at least one named produce supplier with a confirmed certification record, and none could be confirmed in this run (see below). The Cs are real disclosure: Spago's menu names five farms, A.O.C. names three growers by name or first name, and Farmhouse is owned by a farmer.</p>
  <h2>What verification exists for the ${a.producers} named producers</h2>${barChart(['P1','P2','P3','P5','P4'].filter(k => t[k]).map(k => [`${k} · ${TIER_SHORT[k]}`, t[k], k]), tierColors)}
  <p class="sub">Every named producer is P4 (named, not yet verified) except one beef brand program. That is partly a data-access result: the USDA Organic INTEGRITY Database and the CCOF directory are interactive apps that could not be queried from this run, so no registry match was made. <strong>${leads.length} named farms carry organic leads</strong> (${leads.map(p => `<a href="#/p/${p.producer_id}">${esc(p.canonical_name)}</a>`).join(', ')}): the farm says it is certified, or the Santa Monica Farmers Market lists it as ORGANIC. Under our rules a lead is never a tier. Confirming those records is the first job of the next pass, and would move Spago to B.</p>
  <h2>Disclosure by neighborhood</h2>${barChart(hoodRows.map(([h, d, c, n]) => [`${h.length > 26 ? h.slice(0, 24) + '…' : h} (${d}/${n})`, d, c]), {x: 'var(--accent)'})}
  <p class="sub">Bars show restaurants naming at least one producer; the bracket is restaurants read in that area. Curated picks over-represent known farm-forward kitchens; the OpenStreetMap census is the honest read.</p>
  <h2>Most-named producers</h2><div class="panel tablewrap"><table><tr><th>Producer</th><th>Tier</th><th>Named by</th></tr>${top.map(p => `<tr><td><a href="#/p/${p.producer_id}">${esc(p.canonical_name)}</a> <span class="sub">${esc([p.city, p.state].filter(Boolean).join(', '))}</span></td><td><span class="chip tier ${tierBase(p.tier)}">${esc(p.tier)}</span></td><td>${p.n_restaurants}</td></tr>`).join('')}</table></div>
  <p>Weiser Family Farms is the only producer named by two restaurants. Several of the named farms sell at the Santa Monica and Beverly Hills farmers' markets, the same markets a Beverly Hills diner can walk to on Sunday.</p>
  <h2>Not yet graded</h2><p class="sub">These sites failed to load, returned an error, or the domain has lapsed to unrelated content. They are queued, not graded.</p><ul>${(a.not_crawled || []).map(x => `<li>${esc(x.name)} <span class="sub">(${esc(x.reason)})</span></li>`).join('')}</ul>
  <h2>Closed</h2><p class="sub">Found closed during the run and left out.</p><ul>${(a.closed || []).map(x => `<li>${esc(x.name)} <span class="sub">(${esc(x.reason)})</span></li>`).join('')}</ul>
  <h2>How this was made</h2><p>Restaurant universe from OpenStreetMap: every restaurant and café mapped in the study area (${a.universe}), via the Overpass API. Curated picks were added for known farm-forward and fine-dining kitchens. Each restaurant's own site and menu pages were read with Tavily (search, extract and crawl) on ${esc((D.generated_at || '').slice(0,10))}, keeping the verbatim sentence that names a producer. Spago's farms come from the dinner menu it publishes to OpenTable, because its own page lists none. Producers were checked with Tavily against their own sites, certifier pages and the City of Santa Monica and City of Beverly Hills farmers' market vendor lists, matched on name plus place, never name alone. Street map © OpenStreetMap contributors.</p></div>`;
}
function method(){
  app.innerHTML = `<div class="prose"><div class="eyebrow">Methodology</div><h1>How we rate</h1>
  <p class="lede" style="color:var(--ink-2)">Every tier is a statement about <em>what verification exists</em>, and every tier assignment points to a record someone else could check. The low tiers are not accusations.</p>
  <h2>Producer tiers</h2><div class="tablewrap"><table>
  <tr><th>Tier</th><th>Meaning</th><th>Evidence required</th></tr>
  <tr><td><span class="chip tier P1">P1</span></td><td>USDA certified organic</td><td>Record in the USDA Organic INTEGRITY Database, status Certified, <strong>Crops</strong> scope active, certified products cover the supplied category. Re-checked monthly against the published snapshot; a status change is an alert.</td></tr>
  <tr><td><span class="chip tier P2">P2</span></td><td>Peer or third-party certified to an organic-equivalent standard</td><td>Current listing with Certified Naturally Grown, Real Organic Project, Regenerative Organic Certified or Demeter Biodynamic. Not “organic-lite”: a different verification model, described rather than ranked. Add-on certifications are shown alongside a P1 where both exist.</td></tr>
  <tr><td><span class="chip tier P3">P3</span></td><td>Documented practices, self-declared</td><td>A signed, dated questionnaire with yes/no answers (synthetic pesticides, synthetic fertiliser, GMO seed, soil vs hydroponic, transition status). Marketing language does not qualify. Expires after 12 months.</td></tr>
  <tr><td><span class="chip tier P4">P4</span></td><td>Named, not yet verified</td><td>A restaurant names them and we have the archived page. Nothing else established. Our outreach queue, not a demerit.</td></tr>
  <tr><td><span class="chip tier P5">P5</span></td><td>Distributor pass-through</td><td>The named supplier is an intermediary. “Resolvable” if the distributor discloses the farm behind the line; “opaque” if the chain stops there.</td></tr>
  <tr><td><span class="chip tier P6">P6</span></td><td>Undisclosed or declined</td><td>Sourcing requested and not provided under the published rule: ${esc(D.non_response_rule)}. Every request is logged and shown.</td></tr></table></div>
  <p><strong>Context registries.</strong> Two sources add context without changing a tier: the City of Santa Monica Farmers Market vendor list, which marks some vendors ORGANIC, and the City of Beverly Hills Farmers' Market vendor list. A market's “organic” label, like a farm's own claim to be certified, is a lead we confirm in INTEGRITY, never a tier by itself. Welfare programs such as Certified Humane are shown as flags, not as an organic certification.</p><p><strong>This run.</strong> The USDA Organic INTEGRITY Database and the CCOF member directory are interactive applications that could not be queried from the seed run, so no producer has been matched to a registry record yet. Every organic claim is therefore held as a lead, and the grade ceiling for every restaurant in this run is C.</p>
  <p><strong>Edge cases.</strong> Partial scope or partial products are tiered at the item level and never launder the whole operation. Land in the three-year organic transition is flagged, not P1. Certified organic hydroponic is flagged, not ranked. A co-op holding one certificate is the node. Same name, different entity: we match on name + state + address and key on the NOP Operation ID. Every rating shows the date it was verified because sourcing changes with the season.</p>
  <h2>Restaurant grade (v0.2)</h2><p>One grade, three published thresholds: how much of the menu's sourcing is <em>named</em>, how much of that is <em>verified</em> (P1 USDA-certified or P2 peer-certified produce suppliers), and whether any named certification has <em>lapsed</em>. Thresholds, never a weighted score.</p><div class="tablewrap"><table>
  <tr><td><span class="grade A">A</span></td><td><strong>Verified organic sourcing across most of the menu.</strong> Producers named for most of the menu, at least half of the named produce suppliers verified, and no named supplier with a surrendered, suspended or revoked certification.</td></tr>
  <tr><td><span class="grade B">B</span></td><td><strong>Names verified producers.</strong> At least one named produce supplier is USDA-certified or peer-certified. A restaurant that would otherwise be an A is capped here when a named supplier's certification has lapsed.</td></tr>
  <tr><td><span class="grade C">C</span></td><td><strong>Names producers, none verified yet.</strong> Real farms are named (published or on request) but none has a current registry record. This is the outreach queue, not an accusation.</td></tr>
  <tr><td><span class="grade D">D</span></td><td><strong>Claims without names.</strong> “Farm to table”, “locally sourced”, “organic” with nobody named. An unfalsifiable claim ranks below honest silence would if we ranked virtue, and only just above it here.</td></tr>
  <tr><td><span class="grade E">E</span></td><td><strong>Nothing disclosed</strong>, or asked and declined under the published rule. “Not yet asked” is shown separately from “declined”.</td></tr></table></div>
  <p>Verified share is denominated against all named produce suppliers, and A additionally requires that producers are named for most of the menu, so two organic farms out of forty ingredients cannot earn it. Unconfirmed name matches and ambiguous registry records are never counted as verified. Alongside the grade, every restaurant carries the three-way disclosure score a diner can check in one question: <strong>names its producers · names them on request · declined</strong>.</p>
  <h2>Sourcing profile and the denominator rule</h2>
  <p>The profile is a distribution of named produce suppliers across tiers, shown as a bar. It is always denominated against the <strong>whole menu</strong>, not against what the restaurant chose to disclose: two named farms out of forty ingredients is not “100% organic”. Until item-level menu data exists, a reviewer records whether the named suppliers cover most, some or none of the menu, and the hatched band is drawn from that (25% / 65% / 100%). Those are labelled estimates.</p>
  <h2>Badges</h2><p>Thresholds, not scores: ${esc(D.badge_rule)}, i.e. an A whose verified share is at least 80%. Fixed and published. Payment never touches a rating; everyone in the coverage area is rated whether or not they pay, and audit fees are the same regardless of outcome.</p>
  <h2>Corrections</h2><p>Anyone can challenge a rating. What changes one: a registry record, a signed questionnaire, a written statement naming producers, or evidence an archived page is stale. Every change is dated in the changelog. We publish facts (“this restaurant names Farm X”, with the verbatim sentence), not menu copy.</p>
  <h2>Scope</h2><p>${Object.entries(D.slices || {}).map(([k, v]) => `${esc(k)} (${v.join(', ')})`).join('; ')}. Produce only for now.</p></div>`;
}
function forRestaurants(){

  <p class="lede" style="color:var(--ink-2)">We rate everyone in the coverage area whether or not they talk to us, and we change ratings when someone shows us we are wrong. Here is exactly what moves a grade.</p>
  <h2>Restaurants</h2>
  <div class="panel"><h3>D or E → C</h3><p>Name the producers behind your current menu, on your site or in writing to us. Named producers move you to C immediately.</p>
  <h3>C → B</h3><p>At least one named produce supplier must hold a current USDA organic certification or a peer certification (CNG, Real Organic Project, ROC, Demeter). Point us to the registry record and we match it.</p>
  <h3>B → A</h3><p>Publish producers for most of the menu, with at least half of the produce suppliers verified, and no lapsed certifications among them. We time-stamp every rating, so tell us when the menu turns over and we re-verify.</p>
  <h3>Something is wrong</h3><p>An archived page is stale, a farm listed is no longer used, a name was matched to the wrong entity: tell us and we correct it, dated, in the public changelog.</p>
  <a class="btn" href="${mail('Restaurant listing correction', 'Restaurant:\nAddress:\nWhat is wrong or missing:\nProducers behind the current menu (farm name, town, what they supply):\n')}">Send a correction</a></div>
  <h2>Farms and producers</h2>
  <div class="panel"><h3>P4 → P1 or P2</h3><p>Point us to your USDA INTEGRITY record (NOP Operation ID) or your Certified Naturally Grown, Real Organic Project or Regenerative Organic Certified listing. Matching takes a day.</p>
  <h3>P4 → P3</h3><p>Answer a short practices questionnaire, signed by a named person at the farm, with yes/no answers: synthetic pesticides (since when, if no), synthetic fertiliser, GMO seed, soil-grown or hydroponic, in organic transition. It is re-signed annually.</p>
  <a class="btn" href="${mail('Producer verification', 'Farm:\nTown, state:\nNOP Operation ID or certification directory link (if any):\nOtherwise, request the practices questionnaire.\n')}">Verify your farm</a></div>
  <h2>Our commitments</h2><ul><li>Payment never touches a rating. Audit fees are identical regardless of outcome.</li><li>“Declined to disclose” is applied only under the published rule (${esc(D.non_response_rule)}), with every request logged and visible.</li><li>We publish facts about sourcing, never your menu copy.</li><li>Every rubric change is dated in the changelog.</li></ul></div>`;
}
function route(){
  const h = location.hash || '#/';
  document.querySelectorAll('.top nav a').forEach(a => { const href = a.getAttribute('href'); a.classList.toggle('active', href === h || (h.startsWith('#/p/') && href === '#/producers') || (h.startsWith('#/r/') && href === '#/')); });
  map = null; markers = null; vm = null;
  let m;
  if ((m = h.match(/^#\/r\/(\w+)/))) restaurant(m[1]);
  else if ((m = h.match(/^#\/p\/(\w+)/))) producer(m[1]);
  else if (h === '#/producers') producers();
  else if (h === '#/findings' || h === '#/about') findings();
  else if (h === '#/method') method();
  else if (h === '#/restaurants') forRestaurants();
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();

</script>

</body></html>
